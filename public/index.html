<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zugang - Datenschutz-Fragebogen</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="auth-page">

<div class="auth-shell container">
    <div class="auth-header text-center">
        <span class="brand-pill">Privacy Lab</span>
        <h1>Datenschutz-Fragebogen</h1>
        <p>Gestalte deine Lernsessions mit einer klaren, sicheren und modernen Erfahrung.</p>
    </div>

    <div id="auth-section" class="auth-section">
        <div class="auth-switcher" aria-label="Zugang wählen">
            <button type="button" class="auth-tab active" data-auth-tab="login">Anmeldung</button>
            <button type="button" class="auth-tab" data-auth-tab="register">Registrierung</button>
        </div>

        <div class="auth-card">
            <div class="auth-form active" id="login-panel">
                <div class="card-badge blue">Anmeldung</div>
                <h2>Anmelden</h2>
                <form id="login-form">
                    <div class="mb-3">
                        <label for="login-username" class="form-label">Benutzername:</label>
                        <input type="text" id="login-username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="login-password" class="form-label">Passwort:</label>
                        <div class="password-field">
                            <input type="password" id="login-password" class="form-control" required>
                            <button type="button" class="password-toggle" data-target="login-password">Anzeigen</button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-auth btn-primary">Anmelden</button>
                </form>
                <div id="login-message" class="mt-3"></div>
            </div>

            <div class="auth-form" id="register-panel">
                <div class="card-badge green">Registrierung</div>
                <h2>Konto erstellen</h2>
                <form id="register-form">
                    <div class="mb-3">
                        <label for="reg-username" class="form-label">Benutzername:</label>
                        <input type="text" id="reg-username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="reg-password" class="form-label">Passwort:</label>
                        <div class="password-field">
                            <input type="password" id="reg-password" class="form-control" required minlength="6">
                            <button type="button" class="password-toggle" data-target="reg-password">Anzeigen</button>
                        </div>
                        <small class="form-text">Mindestens 6 Zeichen.</small>
                    </div>
                    <button type="submit" class="btn btn-auth btn-success">Registrieren</button>
                </form>
                <div id="register-message" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="login.js"></script>

</body>
</html>
